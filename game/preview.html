<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lockling engine preview</title>
<style>body{margin:0;background:#151729}canvas{display:block;width:100vw;image-rendering:pixelated}</style></head>
<body><canvas id="c"></canvas>
<script type="module">
// Browser preview of lib/game/engine/core.js (serve the repo root, open /game/preview.html).
import { createEngine, W } from '../lib/game/engine/core.js';
import { makeWebGfx } from './gfx-web.js';
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const css = window.innerWidth / W, S = css * (window.devicePixelRatio || 1);
const H = Math.round(window.innerHeight / css), TOP = Number(new URLSearchParams(location.search).get('top') || 0);
cv.width = Math.round(W * S); cv.height = Math.round(H * S); cv.style.height = window.innerHeight + 'px'; ctx.imageSmoothingEnabled = false;
const engine = createEngine(makeWebGfx(ctx), { onBusy: (b, k) => (window.__busy = b), onDone: (k) => (window.__done = k), onAction: (a) => (window.__action = a) }, { height: H, top: TOP });
window.engine = engine;
cv.addEventListener('click', (e) => engine.tap(e.offsetX / css, e.offsetY / css));
const loop = (t) => { ctx.setTransform(S, 0, 0, S, 0, 0); ctx.imageSmoothingEnabled = false; ctx.clearRect(0, 0, W, H); engine.render(t); requestAnimationFrame(loop); };
requestAnimationFrame(loop);
window.__ready = true;
</script></body></html>
