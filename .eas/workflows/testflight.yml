# Build the iOS app and send it to TestFlight.
#
# Trigger: add the "testflight" label to a pull request. The PR's branch is
# built with the production profile and submitted to App Store Connect, so it
# can be tested on device before merging.
#
# Can also be run manually: npx eas-cli workflow:run testflight.yml
name: iOS → TestFlight

on:
  pull_request_labeled:
    labels:
      - testflight

jobs:
  build_ios:
    name: Build iOS (production)
    type: build
    params:
      platform: ios
      profile: production

  submit_ios:
    name: Submit to TestFlight
    needs: [build_ios]
    type: submit
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production

  # Keep only the newest 3 TestFlight builds; expire the older ones.
  # Needs ASC_KEY_ID / ASC_ISSUER_ID / ASC_PRIVATE_KEY in the EAS "production"
  # environment; without them this job just logs "skipping" and passes.
  cleanup_testflight:
    name: Keep newest 3 TestFlight builds
    needs: [build_ios, submit_ios]
    environment: production
    env:
      NEW_BUILD_NUMBER: ${{ needs.build_ios.outputs.app_build_version }}
      TESTFLIGHT_KEEP: '3'
    steps:
      - uses: eas/checkout
      - run: node scripts/expire-old-testflight-builds.mjs
