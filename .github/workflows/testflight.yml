# Build the iOS app on a GitHub macOS runner and send it to TestFlight.
#
# Replaces the EAS cloud build (Expo's Free plan only has a few iOS builds a
# month). macOS runners are free for public repos. `eas build --local` still
# uses the signing credentials and build-number counter stored on EAS, so the
# result is the same as a cloud build, and it doesn't count against EAS quota.
#
# Trigger: add the "testflight" label to a PR (later pushes to that PR rebuild
# it), or run it by hand from Actions → "iOS → TestFlight" → Run workflow.
#
# Secrets (repo → Settings → Secrets and variables → Actions):
#   EXPO_TOKEN        required — expo.dev → Account settings → Access tokens
#   ASC_KEY_ID        optional — App Store Connect API key, for upload + cleanup
#   ASC_ISSUER_ID     optional
#   ASC_PRIVATE_KEY   optional — contents of the .p8 file (raw or base64)
name: iOS → TestFlight

on:
  pull_request:
    types: [labeled, synchronize]
  workflow_dispatch:

concurrency:
  group: testflight-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build iOS (production) and upload
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (contains(github.event.pull_request.labels.*.name, 'testflight') &&
       (github.event.action != 'labeled' || github.event.label.name == 'testflight'))
    # Xcode 27 image: has Xcode 27.1 (iOS 27.1 SDK), needed for iPhone Duo
    # (full-size layout, hinge, outer display). Each image has one major Xcode.
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
    steps:
      - name: Check EXPO_TOKEN
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add an EXPO_TOKEN repository secret (expo.dev → Account settings → Access tokens)."
            exit 1
          fi

      - uses: actions/checkout@v4

      # Pinned: iPhone Duo support needs the iOS 27.1 SDK, and a newer beta on
      # the image must never be picked for an App Store build.
      - name: Select Xcode 27.1
        run: |
          app=/Applications/Xcode_27.1.app
          if [ ! -d "$app" ]; then
            echo "::error::Xcode 27.1 not found on this runner. Installed:"; ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select -s "$app/Contents/Developer"
          xcodebuild -version
          xcodebuild -version | grep -q '^Xcode 27\.1' || { echo "::error::Expected Xcode 27.1"; exit 1; }
          echo "### $(xcodebuild -version | head -1) ($(xcodebuild -version | tail -1))" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Install EAS CLI with npm (the Expo action's yarn global install failed
      # on the macOS runner). EAS reads EXPO_TOKEN from the environment.
      - name: Install EAS CLI
        run: |
          npm install -g eas-cli@latest
          eas --version
          eas whoami

      # Lets `eas submit` use the App Store Connect key from secrets; without
      # it, the key already saved on EAS is used.
      - name: App Store Connect key
        if: env.ASC_KEY_ID != '' && env.ASC_ISSUER_ID != '' && env.ASC_PRIVATE_KEY != ''
        run: |
          key="$RUNNER_TEMP/AuthKey.p8"
          if printf '%s' "$ASC_PRIVATE_KEY" | grep -q 'BEGIN PRIVATE KEY'; then
            printf '%s\n' "$ASC_PRIVATE_KEY" > "$key"
          else
            printf '%s' "$ASC_PRIVATE_KEY" | base64 --decode > "$key"
          fi
          # With the key (Admin role) EAS can also create the provisioning
          # profiles for the watch app and the Live Activity on its own.
          {
            echo "EXPO_ASC_API_KEY_PATH=$key"
            echo "EXPO_ASC_KEY_ID=$ASC_KEY_ID"
            echo "EXPO_ASC_ISSUER_ID=$ASC_ISSUER_ID"
            echo "EXPO_APPLE_TEAM_ID=KBBN9626H9"
            echo "EXPO_APPLE_TEAM_TYPE=INDIVIDUAL"
          } >> "$GITHUB_ENV"

      - name: Build
        run: |
          set -o pipefail
          eas build --platform ios --profile production --local --non-interactive --output "$RUNNER_TEMP/lock.ipa" 2>&1 | tee "$RUNNER_TEMP/eas.log"

      # Logs aren't always reachable, so surface the errors as annotations.
      - name: Build errors
        if: failure()
        run: |
          log="$RUNNER_TEMP/eas.log"
          [ -f "$log" ] || exit 0
          grep -E -A12 "Failed to update Apple capabilities|Apple API error|Error:|error:|❌" "$log" | sed -E 's#/Users/runner/work/[^ ]*/(targets|modules|ios)/#\1/#g' | awk '!seen[$0]++' > "$RUNNER_TEMP/errors.txt" || true
          tail -30 "$log" >> "$RUNNER_TEMP/errors.txt"
          split -l 6 "$RUNNER_TEMP/errors.txt" "$RUNNER_TEMP/err-"
          for f in $(ls "$RUNNER_TEMP"/err-* | head -10); do
            msg=$(cut -c1-400 "$f" | awk 'BEGIN{ORS="%0A"} {gsub(/%/,"%25"); gsub(/\r/,""); print}')
            echo "::error title=eas build::$msg"
          done

      - name: Build number
        id: version
        run: |
          plist="$RUNNER_TEMP/Info.plist"
          unzip -p "$RUNNER_TEMP/lock.ipa" 'Payload/*.app/Info.plist' > "$plist"
          echo "build=$(plutil -extract CFBundleVersion raw "$plist")" >> "$GITHUB_OUTPUT"
          echo "### Build $(plutil -extract CFBundleShortVersionString raw "$plist") ($(plutil -extract CFBundleVersion raw "$plist"))" >> "$GITHUB_STEP_SUMMARY"
          # OTA updates only reach builds with the same runtime version.
          expo="$RUNNER_TEMP/Expo.plist"
          if unzip -p "$RUNNER_TEMP/lock.ipa" 'Payload/*.app/Expo.plist' > "$expo" 2>/dev/null; then
            echo "Runtime version: \`$(plutil -extract EXUpdatesRuntimeVersion raw "$expo" 2>/dev/null || echo '?')\`" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload to TestFlight
        run: eas submit --platform ios --profile production --path "$RUNNER_TEMP/lock.ipa" --non-interactive --wait

      # Keep the newest 3 TestFlight builds, expire older ones (never fails the job).
      - name: Expire old TestFlight builds
        env:
          NEW_BUILD_NUMBER: ${{ steps.version.outputs.build }}
          TESTFLIGHT_KEEP: '3'
        run: node scripts/expire-old-testflight-builds.mjs
