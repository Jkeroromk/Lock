# Keeps the repo's Deployments list short: for each environment
# (Production, Preview, ...) only the newest N records stay.
# This removes GitHub deployment *records* only — Vercel deployments,
# aliases and api.jkeroro.com are not touched.
name: Prune deployments

on:
  schedule:
    - cron: '17 9 * * *' # daily, 09:17 UTC
  workflow_dispatch:
    inputs:
      keep:
        description: Records to keep per environment
        default: '3'
        required: true
      dry_run:
        description: Only list what would be deleted
        type: boolean
        default: false

permissions:
  deployments: write
  contents: read

concurrency:
  group: prune-deployments
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      KEEP: ${{ inputs.keep || '3' }}
      DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
    steps:
      - name: Prune old deployment records
        shell: bash
        run: |
          set -uo pipefail
          if ! [[ "$KEEP" =~ ^[0-9]+$ ]] || [ "$KEEP" -lt 1 ]; then
            echo "::error::keep must be a whole number >= 1 (got '$KEEP')"; exit 1
          fi

          # All deployments as "id<TAB>environment<TAB>created_at"
          gh api "repos/$REPO/deployments?per_page=100" --paginate \
            --jq '.[] | [.id, .environment, .created_at] | @tsv' > all.tsv
          total=$(wc -l < all.tsv)

          # Newest first within each environment; everything past the first $KEEP goes.
          sort -t$'\t' -k2,2 -k3,3r all.tsv \
            | awk -F'\t' -v keep="$KEEP" '{ if (++seen[$2] > keep) print }' > prune.tsv
          count=$(wc -l < prune.tsv)

          echo "Total: $total, deleting: $count (keeping newest $KEEP per environment)"
          cut -f2 all.tsv | sort | uniq -c
          {
            echo "### Prune deployments"
            echo "Total **$total**, deleting **$count**, keeping newest **$KEEP** per environment${DRY_RUN:+ (dry run: $DRY_RUN)}."
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run — would delete:"; cat prune.tsv; exit 0
          fi

          failed=0
          while IFS=$'\t' read -r id env created; do
            # GitHub only deletes inactive deployments, so mark it inactive first.
            gh api -X POST "repos/$REPO/deployments/$id/statuses" -f state=inactive > /dev/null 2>&1 || true
            if gh api -X DELETE "repos/$REPO/deployments/$id" > /dev/null 2>&1; then
              echo "Deleted $id  $env  $created"
            else
              echo "::warning::Could not delete $id ($env, $created)"; failed=$((failed + 1))
            fi
          done < prune.tsv

          echo "Done. Failed: $failed"
          echo "Failed: $failed" >> "$GITHUB_STEP_SUMMARY"
