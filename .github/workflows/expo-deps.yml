name: Expo dependencies

# Applies dependency changes from CI, where the npm registry is reachable.
# Two helpers in one workflow (were expo-install.yml + expo-upgrade.yml):
#   install — .github/expo-install.txt (packages to add, one per line) and
#             .github/npm-uninstall.txt (packages to remove, one per line);
#             runs `npx expo install` / `npm uninstall`, commits back.
#   upgrade — .github/expo-upgrade.txt (shell commands, one per line);
#             runs them in order, then expo-doctor and tsc, commits the
#             package files and the logs in .github/upgrade-logs/ back.
# Put the trigger file(s) on a branch and push; only the job whose files
# changed runs. Nothing runs on main. The upgrade job can also be run by
# hand from Actions → "Expo dependencies" → Run workflow.
on:
  push:
    branches-ignore: [main]
    paths:
      - '.github/expo-install.txt'
      - '.github/npm-uninstall.txt'
      - '.github/expo-upgrade.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: expo-deps-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      install: ${{ steps.changed.outputs.install }}
      upgrade: ${{ steps.changed.outputs.upgrade }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Which trigger files changed
        id: changed
        run: |
          install=false
          upgrade=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            upgrade=true
          else
            files=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" || true)
            echo "$files" | grep -qE '^\.github/(expo-install\.txt|npm-uninstall\.txt)$' && install=true || true
            echo "$files" | grep -qE '^\.github/expo-upgrade\.txt$' && upgrade=true || true
          fi
          echo "install=$install" >> "$GITHUB_OUTPUT"
          echo "upgrade=$upgrade" >> "$GITHUB_OUTPUT"
          echo "install=$install upgrade=$upgrade"

  install:
    needs: changes
    if: needs.changes.outputs.install == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Remove packages
        run: if [ -s .github/npm-uninstall.txt ]; then npm uninstall $(cat .github/npm-uninstall.txt); fi
      - name: Add packages
        run: if [ -s .github/expo-install.txt ]; then npx expo install $(cat .github/expo-install.txt); fi
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if [ -f app.json ]; then git add app.json; fi
          git commit -m "Dependencies: +$(cat .github/expo-install.txt 2>/dev/null) -$(cat .github/npm-uninstall.txt 2>/dev/null)" || echo "nothing to commit"
          git push

  upgrade:
    needs: [changes, install]
    if: >-
      always() &&
      needs.install.result != 'failure' &&
      needs.install.result != 'cancelled' &&
      (needs.changes.outputs.upgrade == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: tsc before
        run: |
          mkdir -p .github/upgrade-logs
          npx tsc --noEmit --pretty false > .github/upgrade-logs/tsc-before.log 2>&1 || true
      - name: Run commands
        run: |
          : > .github/upgrade-logs/commands.log
          while IFS= read -r line || [ -n "$line" ]; do
            [ -z "$line" ] && continue
            case "$line" in \#*) continue ;; esac
            echo "\$ $line" | tee -a .github/upgrade-logs/commands.log
            bash -c "$line" >> .github/upgrade-logs/commands.log 2>&1 || echo "!! exit $?" | tee -a .github/upgrade-logs/commands.log
          done < .github/expo-upgrade.txt
      - name: expo-doctor
        run: npx --yes expo-doctor@latest > .github/upgrade-logs/doctor.log 2>&1 || true
      - name: tsc after
        run: npx tsc --noEmit --pretty false > .github/upgrade-logs/tsc-after.log 2>&1 || true
      - name: Versions
        run: npm ls --depth=0 > .github/upgrade-logs/versions.log 2>&1 || true
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/upgrade-logs
          if [ -f app.json ]; then git add app.json; fi
          git commit -m "Expo upgrade: run .github/expo-upgrade.txt" || echo "nothing to commit"
          git push
