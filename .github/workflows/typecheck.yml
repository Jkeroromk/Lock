# TypeScript check for the app and the backend on every PR.
# Fails the check when tsc finds an error (both were clean as of 2026-11-04);
# errors also show up as annotations on the PR's "Files changed" tab.
name: Typecheck

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: typecheck-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Shared Swift files in sync
        run: node scripts/sync-watch-model.mjs --check
      - run: npm ci
      - name: tsc (app)
        run: npx tsc --noEmit --pretty false

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci || npm install --no-audit --no-fund
      - name: tsc (backend)
        run: npx prisma generate >/dev/null 2>&1 || true; npx tsc --noEmit --pretty false
