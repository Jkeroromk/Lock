# Compiles the iOS app, the Live Activity widget and the Apple Watch app for the
# simulator, without signing. Catches Swift errors in the native code before a
# TestFlight build (which also needs provisioning profiles for every target).
name: iOS compile check

on:
  pull_request:
    paths:
      - 'targets/**'
      - 'modules/**'
      - 'app.json'
      - 'package.json'
      - '.github/workflows/ios-compile.yml'
  workflow_dispatch:

concurrency:
  group: ios-compile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compile:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Shared Swift files in sync
        run: node scripts/sync-watch-model.mjs --check

      - name: Prebuild
        run: npx expo prebuild --platform ios --no-install

      - name: Pods
        working-directory: ios
        run: pod install

      - name: Build (simulator, unsigned)
        run: |
          set -o pipefail
          scheme=$(xcodebuild -list -json -workspace ios/*.xcworkspace | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);console.log(j.workspace.schemes.find(n=>/^lock$/i.test(n))||j.workspace.schemes[0])})')
          echo "Scheme: $scheme"
          xcodebuild build \
            -workspace ios/*.xcworkspace \
            -scheme "$scheme" \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            | tee "$RUNNER_TEMP/build.log" | grep -E "error:|warning: .*(LockWorkout|LockLive|LockWatch)|\*\* BUILD" || true
          grep -q "\*\* BUILD SUCCEEDED \*\*" "$RUNNER_TEMP/build.log"

      # Logs aren't always reachable, so surface the errors as annotations
      # (a few lines per annotation; GitHub keeps at most 10 per step).
      - name: Errors
        if: failure()
        run: |
          log="$RUNNER_TEMP/build.log"
          [ -f "$log" ] || exit 0
          grep -E "(error|fatal error):" "$log" | sed -E 's#^/Users/runner/work/[^/]+/[^/]+/##' | sort -u > "$RUNNER_TEMP/errors.txt" || true
          if [ ! -s "$RUNNER_TEMP/errors.txt" ]; then tail -40 "$log" > "$RUNNER_TEMP/errors.txt"; fi
          split -l 6 "$RUNNER_TEMP/errors.txt" "$RUNNER_TEMP/err-"
          for f in $(ls "$RUNNER_TEMP"/err-* | head -10); do
            msg=$(cut -c1-400 "$f" | awk 'BEGIN{ORS="%0A"} {gsub(/%/,"%25"); gsub(/\r/,""); print}')
            echo "::error title=xcodebuild::$msg"
          done
